[package]
name = "spotoei-player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "spotoei-player"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "io-util",
  "io-std",
  "sync",
  "time",
  "signal",
  "net",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "linux-native-sync-persistent",
] }
rand = "0.8"
sha2 = "0.11"
base64 = "0.22"
urlencoding = "2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
realfft = "3.4"
crossbeam-channel = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# MPRIS D-Bus service so desktop environments can route media keys and
# Bluetooth headset controls (AVRCP) to the player. Linux also builds
# librespot with ALSA/PulseAudio backends; other platforms use CoreAudio/WASAPI
# through the rodio backend and must not pull alsa-sys/pulse-sys.
[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.10"
librespot = { version = "0.8.0", default-features = false, features = [
  "rodio-backend",
  "alsa-backend",
  "pulseaudio-backend",
  "rustls-tls-native-roots",
] }

# macOS/Windows have no MPRIS: souvlaki bridges MPRemoteCommandCenter and the
# Windows System Media Transport Controls. Windows also needs an HWND, which
# winit provides through an invisible window.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
souvlaki = "0.8.3"
winit = "0.30"
librespot = { version = "0.8.0", default-features = false, features = [
  "rodio-backend",
  "rustls-tls-native-roots",
] }

[lints]
workspace = true
