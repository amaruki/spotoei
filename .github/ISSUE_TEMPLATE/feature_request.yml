name: Feature request
description: Suggest an idea or improvement for SPOTOEI
title: 'feat: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Check existing issues and the specifications in `docs/` before opening a request.
        Features the project has already declined are unlikely to be accepted without a
        clear change of direction.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is currently hard or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like SPOTOEI to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I checked existing issues and documentation and this is not already covered.
          required: true
