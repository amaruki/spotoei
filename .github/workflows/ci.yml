name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Type check
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Check install script syntax
        run: sh -n scripts/install.sh
      - name: Check PowerShell install script syntax
        run: pwsh -NoProfile -Command "[void][scriptblock]::Create((Get-Content -Raw scripts/install.ps1))"

  integration:
    name: Rust and integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install audio build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libpulse-dev libdbus-1-dev pkg-config
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build player sidecar
        run: cargo build -p spotoei-player --locked
      - name: Rust format check
        run: cargo fmt --all --check
      - name: Rust clippy
        run: cargo clippy --all-targets --locked
      - name: Rust tests
        run: cargo test -p spotoei-player --locked
      - name: Test
        run: bun test
