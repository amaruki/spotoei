name: Dependabot lockfile

# Dependabot PRs can leave bun.lock/Cargo.lock out of sync with the bumped
# manifests, which makes the CI `--frozen-lockfile`/`--locked` gates fail.
# This refreshes both lockfiles on the PR branch and re-dispatches CI, because
# events triggered by GITHUB_TOKEN do not start workflow runs on their own.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: write

concurrency:
  group: dependabot-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh lockfiles
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0
      - name: Refresh bun.lock
        run: bun install
      - name: Refresh Cargo.lock
        run: cargo metadata --format-version 1 > /dev/null
      - name: Commit lockfiles
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "lockfiles already up to date"
            exit 0
          fi
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git add bun.lock Cargo.lock
          git commit -m "chore(deps): refresh lockfiles"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Re-run CI on the updated branch
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run ci.yml --ref "$BRANCH" -R "$GITHUB_REPOSITORY"
